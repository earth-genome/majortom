[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "majortom_eg"
version = "1.1.0"
description = "Implementation of the ESA MajorTom grid system (Rust-backed)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["geospatial", "grid", "geohash", "major-tom", "esa"]
authors = [
  { name = "tingold", email = "hutch@earthgenome.org" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "shapely",
]

[project.optional-dependencies]
test = [
  "numpy",
  "geolib",
  "pytest",
]

[project.urls]
Documentation = "https://github.com/earth-genome/majortom#readme"
Issues = "https://github.com/earth-genome/majortom/issues"
Source = "https://github.com/earth-genome/majortom"

[tool.maturin]
python-source = "python"
module-name = "majortom_eg._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
  "maturin>=1.7,<2.0",
  "numpy",
  "geolib",
  "pytest",
]

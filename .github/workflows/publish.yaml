name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    name: check version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # maturin names the wheels after the pyproject version, not the tag, so a
      # tag pushed without a version bump silently rebuilds an already-published
      # release and PyPI rejects the upload.
      - name: Compare tag to pyproject version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag: $tag_version, pyproject: $project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $project_version. Bump the version in pyproject.toml, Cargo.toml and python/majortom_eg/__about__.py before tagging."
            exit 1
          fi

  build-wheels:
    name: build (${{ matrix.os }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7

      - name: Fetch majortom-rs into vendor/
        uses: actions/checkout@v7
        with:
          repository: earth-genome/majortom-rs
          path: vendor/majortom-rs

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/majortom_eg
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

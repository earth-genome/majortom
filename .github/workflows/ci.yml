name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Fetch majortom-rs into vendor/
        uses: actions/checkout@v7
        with:
          repository: earth-genome/majortom-rs
          path: vendor/majortom-rs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Builds the extension through the maturin backend declared in
      # pyproject.toml. `maturin develop` is not usable here because it
      # requires an activated virtualenv, which setup-python does not create.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: pytest tests/ -q

  linux-wheels:
    name: build linux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch majortom-rs into vendor/
        uses: actions/checkout@v7
        with:
          repository: earth-genome/majortom-rs
          path: vendor/majortom-rs

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: dist

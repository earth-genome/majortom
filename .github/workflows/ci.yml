name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch majortom-rs into vendor/
        uses: actions/checkout@v4
        with:
          repository: earth-genome/majortom-rs
          path: vendor/majortom-rs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package (maturin)
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy geolib shapely
          maturin develop --release

      - name: Run tests
        run: pytest tests/ -q

  linux-wheels:
    name: build linux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch majortom-rs into vendor/
        uses: actions/checkout@v4
        with:
          repository: earth-genome/majortom-rs
          path: vendor/majortom-rs

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist
